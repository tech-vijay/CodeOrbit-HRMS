services:
  - type: web
    name: codeorbit-hrms-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace=@codeorbit/backend && npm run build --workspace=@codeorbit/backend
    startCommand: npm run prisma:migrate:deploy --workspace=@codeorbit/backend && npm run start --workspace=@codeorbit/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: ENABLE_DEMO_SEED
        value: "false"
  - type: web
    name: codeorbit-hrms-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@codeorbit/frontend
    staticPublishPath: apps/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://codeorbit-hrms-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
